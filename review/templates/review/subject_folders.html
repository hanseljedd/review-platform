{% extends "review/base.html" %}
{% load static %}

{% block content %}
<div class="content-container" style="padding: 40px; max-width: 1200px; margin: 0 auto; color: #fff;">
  
  <!-- Breadcrumb -->
  <div style="margin-bottom: 24px; font-size: 0.9rem; color: #94a3b8;">
    <a href="{% url 'review:landing' %}" style="color: #94a3b8; text-decoration: none;">Home</a> 
    <span style="margin: 0 8px;">/</span>
    <span style="color: #fff;">{{ subject.title }}</span>
  </div>

  <div style="text-align: center; margin-bottom: 48px;">
    <h1 style="font-size: 3rem; font-weight: 800; margin-bottom: 16px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      {{ subject.title }}
    </h1>
    <p style="color: #94a3b8; font-size: 1.1rem;">Select a category to browse topics</p>
  </div>

  <div class="folders-grid">
    {% for folder in folders %}
    <a href="{% url 'review:folder_topics' subject.slug folder.title %}" style="text-decoration: none;">
      <div class="folder-card" style="
          background: #1e293b; 
          border: 1px solid #334155; 
          border-radius: 16px; 
          padding: 32px; 
          text-align: center; 
          transition: all 0.3s ease;
          position: relative;
          overflow: hidden;
      ">
        <div style="
            width: 64px; 
            height: 64px; 
            background: rgba(34, 197, 94, 0.1); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 16px;
            color: #22c55e;
        ">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <h3 style="color: #fff; font-size: 1.25rem; font-weight: 600; margin: 0;">{{ folder.title }}</h3>
        
        <!-- Hover Effect Overlay -->
        <div class="hover-overlay" style="
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(34, 197, 94, 0.05);
            opacity: 0;
            transition: opacity 0.3s;
        "></div>
      </div>
    </a>
    {% empty %}
    <div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 48px;">
      <p>No folders found in this subject yet.</p>
    </div>
    {% endfor %}
  </div>

  <style>
    /* Responsive Grid Layout */
    .folders-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr; /* Mobile: 1 column */
    }

    /* Tablet: 2 columns */
    @media (min-width: 640px) {
      .folders-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Laptop: 3 columns */
    @media (min-width: 900px) {
      .folders-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Desktop: 4 columns */
    @media (min-width: 1100px) {
      .folders-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .folder-card:hover {
      transform: translateY(-5px);
      border-color: #22c55e;
      box-shadow: 0 10px 30px -10px rgba(34, 197, 94, 0.3);
    }
    .folder-card:hover .hover-overlay {
      opacity: 1;
    }
  </style>

</div>
{% endblock %}
